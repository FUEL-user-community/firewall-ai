# ══════════════════════════════════════════════════════════════
# Core Defense — Device Fleet Registry
# ══════════════════════════════════════════════════════════════
# This file declares the firewalls managed by the agent.
# Credentials are NOT stored here — they live in your secrets backend.
#
# Secret key naming convention:
#   Each device's API key is stored as: panos_api_key_{device_name}
#   Example: device "fw-hq" → secret key "panos_api_key_fw_hq"
#
# To add a new firewall:
#   1. Add an entry below
#   2. Store its API key in your secrets backend as panos_api_key_{name}
#   3. Restart the agent
# ══════════════════════════════════════════════════════════════

firewalls:
  fw-hq:
    ip: 192.168.1.254
    label: "HQ Perimeter Firewall"
    virtual_router: "lab-vr"  # Active virtual router on fw-hq (auto-discovered if omitted)
    default: true             # Used when target_device is not specified
    # Optional: Pin the SHA-256 certificate fingerprint for zero-trust TLS without CA files
    # ssl_fingerprint: "SHA256:49:CD:29:2D:40:AF:94:D6:86:B6:EE:17:CB:67:CE:4D:ED:40:E9:C0:BE:2B:25:37:C7:BC:6E:37:CF:9A:2E:D0" 

  # Uncomment to add more firewalls:
  # fw-lab:
  #   ip: 10.0.0.1
  #   label: "Lab / Test Firewall"
  #   virtual_router: "lab-vr"
  #
  # fw-branch-01:
  #   ip: 172.16.0.1
  #   label: "Branch Office — Seattle"
  #   virtual_router: "default"
