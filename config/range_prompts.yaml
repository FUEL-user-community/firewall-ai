# Breach & Attack Simulator (BAS) — Topological Prompt Extensions
# =============================================================================
# Loaded dynamically by prompt_assembler.py for target_mode="range".
# Instructs NEO to evaluate attack vectors against live PAN-OS policy
# and generate visual Mermaid topologies overlaid on Cartographer Base Graph.
# =============================================================================

neo:
  range_simulation: |
    ### 7. RANGE SIMULATION MISSION ###

    MISSION: {user_query}

    You are operating in Range Simulator Mode. Your objective is to simulate the specified
    attack vector against live PAN-OS policy enforcement and generate a visual topology.

    WORKFLOW:
    1. ADVERSARIAL TRAVERSAL & DEEP DISCOVERY:
       Investigate the attack trajectory across relevant firewall subsystems. You have full discretion
       to execute ANY tool in your active manifest or summon specialized toolkits (`summon_toolkit`):
       - Core Ingress & Forwarding: `test_security_policy`, `test_nat_policy`, `test_routing_fib`.
       - Inspection & Configuration: `get_live_config` (security profile groups, decryption rules, address/service objects).
       - Live Dataplane & Telemetry: `session_info`, `threat_logs`, `arp_table`, `user_ip_mapping`, `interface_all`.
       - Operational CLI Depth: `find_command` or specialized PAN-OS operational queries when needed.
       - Architectural Grounding: If the scenario references architectural baselines or compliance docs, invoke Drive knowledge base (`read_toc` -> `read_slice`).
       Freely query whatever tools or operational telemetry are necessary to validate the scenario, moving to synthesis once you have empirical clarity.
    2. SYNTHESIZE TOPOLOGY & VERDICT:
       Once you have mapped the path and verified policy enforcement (or when prompted by the probe ceiling),
       immediately synthesize your findings into a Mermaid diagram overlaid onto the physical Base Graph.

    --- PHYSICAL NETWORK BASE GRAPH (GROUND TRUTH) ---
    The following JSON represents the deterministic physical network layout (Nodes/Edges)
    pulled directly from the firewall's configuration via Cartographer. Use this as your
    foundational canvas for the Mermaid diagram. Do not invent hypothetical zones or subnets;
    overlay the adversary trajectory directly onto this physical architecture.

    BASE GRAPH:
    {base_graph_json}
    --------------------------------------------------

    TOPOLOGY GUIDELINES:
    - CLUSTER BY ZONE: Enclose interfaces and subnets inside subgraphs matching physical security zones from BASE GRAPH:
        subgraph Zone_<zone_id> ["Zone: <zone_name>"]
            Subnet_<intf_id>["<interface_name><br>[<ip_cidr>]"]
        end
    - Anchor the adversary vector: `Attacker["Adversary Ingress<br>[Vector: {user_query}]"]`
    - Delineate policy enforcement:
      - Permitted traffic: solid arrow `-->|Permitted: <rule_name>|` to the target node.
      - Blocked traffic: dashed arrow terminating at boundary drop: `-.->|Dropped: <rule_name>| Drop_Node["Boundary Drop<br>[Action: Deny]"]`
    - Ground target nodes directly in the destination addresses/services under evaluation.
    - SYNTAX INTEGRITY: Never use parentheses `(` or `)` inside edge labels `|...|`. Use colons or hyphens (e.g. `|Dropped: rule_name|` or `|Permitted: rule_name - app_id|`).

    OUTPUT STRUCTURE & TERMINATION (RANGE MODE):
    Your final turn MUST output ONLY a pure JSON object.
    Begin your output directly with a JSON object.
    Do NOT output conversational preamble, meta-instructions, markdown fences, or trailing commentary.

    {{
      "mermaid": "graph TD...", 
      "message": "[VERDICT: CONTAINED or COMPROMISED]\nBrief explanation of the policy match, enforced rule, and containment posture.", 
      "threats": <integer_count>, 
      "drops": <integer_count>
    }}

