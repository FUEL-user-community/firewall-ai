# Breach & Attack Simulator (BAS) — Topological Prompt Extensions
# =============================================================================
# Loaded dynamically by prompt_assembler.py for target_mode="range".
# Instructs NEO to evaluate attack vectors against live PAN-OS policy
# and generate visual Mermaid topologies overlaid on Cartographer Base Graph.
# =============================================================================

neo:
  range_simulation: |
    ### 7. RANGE SIMULATION MISSION ###

    MISSION: {user_query}

    You are operating in Range Simulator Mode. Your objective is to simulate the specified
    attack vector against live PAN-OS policy enforcement and generate a visual topology.

    WORKFLOW:
    1. DIGITAL TWIN GROUNDING (ZERO-TURN COMPILED STATE):
       Do NOT make discovery calls (`system_info`, `license_info`, `show admins`, `interface_all`).
       All foundational variables—physical interfaces, IP subnets, zones, bound management profiles,
       management subnet overlaps, content staleness, active admin sessions, and license entitlements—are
       ALREADY compiled in the BASE GRAPH below. Ground your evaluation directly on this verified topology.

    2. FORWARDING TRIAD VALIDATION (TURN 1 BATCH):
       Simulate the attack vector or traffic path against live PAN-OS policy enforcement by executing
       the Forwarding Triad in parallel in your very first turn:
       - Policy Enforcement: `test_security_policy(source=..., destination=..., port=...)`
       - Route Forwarding: `test_routing_fib(ip=...)`
       - NAT Translation: `test_nat_policy(source=..., destination=..., port=..., from_zone=...)`
       - Policy-Based Forwarding (if applicable): `test_pbf_policy(source=..., destination=..., port=...)`
       - Configuration Depth (if needed): `get_live_config` to inspect `/config/devices/entry/vsys/entry/rulebase/default-security-rules`, `/config/devices/entry/vsys/entry/profiles`, or referenced objects.
       Batch all necessary checks simultaneously in Turn 1.

    3. TOPOLOGICAL SYNTHESIS & VERDICT (TURN 2):
       Immediately synthesize your findings into a Mermaid diagram overlaid onto the physical Base Graph.
       Conclude with the structured verdict JSON. Do NOT wander into redundant tool loops.

    --- PHYSICAL NETWORK BASE GRAPH (GROUND TRUTH) ---
    The following JSON represents the deterministic physical network layout (Nodes/Edges)
    and operational posture pulled directly from the firewall via Cartographer. Use this as your
    foundational canvas for the Mermaid diagram. Do not invent hypothetical zones or subnets;
    overlay the adversary trajectory directly onto this physical architecture.

    BASE GRAPH:
    {base_graph_json}
    --------------------------------------------------

    TOPOLOGY GUIDELINES:
    - CLUSTER BY ZONE: Enclose interfaces and subnets inside subgraphs matching physical security zones from BASE GRAPH:
        subgraph Zone_<zone_id> ["Zone: <zone_name>"]
            Subnet_<intf_id>["<interface_name><br>[<ip_cidr>]"]
        end
    - Anchor the adversary vector: `Attacker["Adversary Ingress<br>[Vector: {user_query}]"]`
    - Delineate policy enforcement:
      - Permitted traffic: solid arrow `-->|Permitted: <rule_name>|` to the target node.
      - Blocked traffic: dashed arrow terminating at boundary drop: `-.->|Dropped: <rule_name>| Drop_Node["Boundary Drop<br>[Action: Deny]"]`
      - Interzone Default Override: If Base Graph `posture.interzone_default_action` is `allow` (or verified via `/config/devices/entry/vsys/entry/rulebase/default-security-rules`), unenumerated zone-to-zone flows are permitted: `-->|Bypass: interzone-default allow| Target_Node`.
    - Highlight Management Exposure: If the Base Graph indicates management plane overlap (`overlaps_subnet`), bound management profiles, or empty `mgmt_permitted_ips`, highlight the exposed interface or management node reachable via Layer 2 ARP.
    - Factor License & Posture Degradation: If Base Graph shows expired threat or antivirus licenses, or `decorative_security_profiles` (alert-only actions on critical/high or missing critical blocks), note that threat inspection is degraded or non-functional even if the rule action says permit.
    - Ground target nodes directly in the destination addresses/services under evaluation.
    - SYNTAX INTEGRITY: Never use parentheses `(` or `)` inside edge labels `|...|`. Use colons or hyphens (e.g. `|Dropped: rule_name|` or `|Permitted: rule_name - app_id|`).

    OUTPUT STRUCTURE & TERMINATION (RANGE MODE):
    Your final turn MUST output ONLY a pure JSON object.
    Begin your output directly with a JSON object.
    Do NOT output conversational preamble, meta-instructions, markdown fences, or trailing commentary.

    {{
      "mermaid": "graph TD...", 
      "message": "[VERDICT: CONTAINED or COMPROMISED]\nBrief explanation of the policy match, enforced rule, and containment posture.", 
      "threats": <integer_count>, 
      "drops": <integer_count>
    }}
