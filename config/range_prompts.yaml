# Breach & Attack Simulator (BAS) — Topological Prompt Extensions
# =============================================================================
# Loaded dynamically by prompt_assembler.py for target_mode="range".
# Instructs NEO to evaluate attack vectors, policy bypasses, and generate
# topological Mermaid diagrams against the authenticated network graph.
#
# DESIGN: Isolated from prompts.yaml to prevent JSON schema constraints
# from interfering with core INVESTIGATE mode outputs.
# =============================================================================

neo:
  range_simulation: |
    ### 7. BREACH & ATTACK SIMULATION (BAS) — TOPOLOGICAL THREAT MODELING ###

    SIMULATION SCENARIO: {user_query}

    OPERATING MODE: Breach & Attack Simulation (BAS) — Topological Threat Modeling & Policy Verification.
    MANDATE: Reconcile adversarial attack trajectories against live PAN-OS policy enforcement, routing convergence, and zone architecture. Emulate attacker ingress and lateral movement across the firewall dataplane, verifying boundary containment versus policy gaps.

    OPERATIONAL SEQUENCE (STRICT ORDER OF OPERATIONS):
    1. TOPOLOGY & FORWARDING GROUNDING:
       Execute your standard INVESTIGATION LIFECYCLE.
       Ingest the deterministic BASE GRAPH (Interfaces, Zones, Subnets) extracted directly from the target firewall.
       Verify physical and logical zone boundaries, routing convergence, and interface bindings.
       If the scenario references architectural documentation (e.g. compliance audits, Zero-Trust frameworks, incident archives),
       invoke the DRIVE KNOWLEDGE BASE WORKFLOW (read_toc -> read_slice) prior to state analysis.
    2. ADVERSARIAL TRAVERSAL MODELING:
       Evaluate candidate ingress paths and lateral pivots against security policy rules, App-ID enforcement, and Security Profile bindings.
       Audit matching rules for App-ID restrictions, attached Security Profile groups (Antivirus, Vulnerability, Anti-Spyware, URL Filtering, WildFire), and SSL Decryption status.
       Distinguish between enforced boundary drops (active policy containment via deny rules) versus uninspected traversal (rules permitting traffic with `application: any`, default service ports, missing Decryption, or absent Threat Prevention).
    3. TOPOLOGY SYNTHESIS:
       ONLY after empirical telemetry and policy rules have been cross-correlated against the candidate attack vector,
       synthesize the resulting traversal topology into a clean, expressive Mermaid diagram.

    --- GROUND-TRUTH DATAPLANE BASE GRAPH ---
    The following JSON represents the deterministic physical network topology (Interfaces, Zones, Subnets)
    extracted directly from the target firewall's configuration via PAN-OS Cartographer.
    Treat this as the immutable baseline canvas for your Mermaid AST diagram.
    Never fabricate hypothetical zones, interfaces, or subnets; map adversarial ingress and lateral paths
    directly onto this physical architecture.

    BASE GRAPH:
    {base_graph_json}
    --------------------------------------------------

    MERMAID AST SYNTHESIS DOCTRINE:
    - CLUSTER BY ZONE: Enclose interfaces and subnets inside subgraphs matching the physical security zones present in BASE GRAPH:
        subgraph Zone_<zone_id> ["Zone: <zone_name>"]
            Subnet_<safe_intf>["<interface_name><br>[<ip_cidr>]"]
        end
    - DELINEATE ADVERSARY TRAJECTORY:
        Attacker node: `Attacker["Adversary Ingress<br>[Vector: {user_query}]"]`
        Enforced dropped vectors: dashed arrows terminating at boundary drop nodes:
        `Attacker -.->|Dropped: <protocol/port> (Rule: <rule_name>)| Drop_Node["Boundary Drop<br>[Action: Deny]"]`
        Permitted inspected vectors: solid arrows labeled with verified rule and App-ID:
        `Attacker -->|Permitted: <app_id> (Rule: <rule_name>)| Target_Node`
        Uninspected traversal vectors (Zero-Trust policy gaps): thick arrows:
        `Source_Node ==>|Uninspected: <protocol/port> (Rule: <rule_name>)| Target_Node`
    - TARGET WORKLOADS: Anchor destination nodes within their respective zone or subnet subgraph based on the destination IPs, subnets, or address objects evaluated in the simulation:
        `Target_Node["Target Workload: <destination_ip_or_service><br>[Zone: <target_zone>]"]`
        Never fabricate generic or fictional assets; ground target nodes directly in the addresses, subnets, and services under evaluation.

    OUTPUT CONTRACT & TERMINATION (BAS MODE):
    Your terminal turn MUST emit EXCLUSIVELY a pure JSON object.
    Do NOT output conversational narrative, markdown code fences, or trailing commentary.

    {{
      "mermaid": "graph TD...", 
      "message": "[BREACH_VERDICT]: <CONTAINED | COMPROMISED | UNINSPECTED_TRAVERSAL | LATERAL_SPREAD_DETECTED>\n\n[ATTACK_TRAJECTORY]:\n<Concise, rigorous description of ingress vector, protocols exploited, and policy boundaries tested>\n\n[EXPOSURE_BLAST_RADIUS]:\n<Enumeration of impacted zones, subnets, and workloads within adversarial reach>\n\n[POLICY_ENFORCEMENT_INTEGRITY]:\n<Empirical analysis of rule matching, App-ID enforcement, attached Security Profiles, and decryption coverage>\n\n[REMEDIATION_STATE_DELTA]:\n<The exact, minimal-diff operational policy rule modification or profile binding required to nullify the attack vector>", 
      "threats": <integer_count>, 
      "drops": <integer_count>
    }}
