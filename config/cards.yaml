# CORE DEFENSE — Card Definition Registry
# ═══════════════════════════════════════════════════════════════════════
# Declarative card definitions. Same pattern as commands.yaml.
# Each card defines: tool chain, reasoning prompt, trigger, actions.
#
# Schedule types: continuous (5m) | periodic (30m) | daily | weekly
# Severity default: normal (can be escalated by LLM or baseline)
# ═══════════════════════════════════════════════════════════════════════

cards:

  # ─── CONTINUOUS CARDS (Every 5 Minutes) ─────────────────────────────
  # Active threat hunting — time-sensitive detections

  autonomous_chain_breaker:
    id: "FT-01"
    name: "Multi-Stage Exploit Chaining & Lateral Traverse"
    description: "Evaluates correlated low/medium severity signals against routing and policy to detect active kill-chain assembly"
    severity: "critical"
    schedule: "continuous"
    interval_seconds: 300
    tool_chain:
      - threat_logs
      - test_security_policy
      - test_routing_fib
    reasoning_prompt: |
      Adversaries leverage low-severity reconnaissance signals to assemble multi-stage kill chains prior to lateral traverse.
      1. Query threat_logs. Identify sequences of low/medium severity indicators clustered from an identical source IP.
      2. LATERAL TRAVERSE EVALUATION: For any suspicious source address, systematically probe the perimeter:
         a) Execute test_routing_fib to confirm active routing convergence and return path availability.
         b) Execute test_security_policy to verify whether the source is permitted lateral traverse into critical 
            internal assets (e.g. Identity Providers, Database Clusters, Management Subnets) over sensitive ports (e.g. 389, 1433, 22, 445).
      3. If policy simulation confirms that the firewall permits lateral traverse from the flagged IP to internal segments, 
         escalate finding to CRITICAL. If hardware enforcement actively drops the traversal, calibrate to CAUTION.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing attack vector, target asset exposure, and policy traversal results",
        "evidence": ["tool: key finding", ...],
        "metrics": {"chain_length": N, "source_ips_flagged": N}
      }
    actions:
      - label: "Contain Source (DAG)"
        tool: "apply_dynamic_tag"
        requires_approval: true
        tool_args:
          tag: "NEO-Containment-L1"
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 24

  sub_30_breakout:
    id: "FT-02"
    name: "Rapid Ingress-to-Lateral Movement Correlation"
    description: "Detects unauthorized lateral movement within 5 minutes of remote gateway authentication"
    severity: "critical"
    schedule: "continuous"
    interval_seconds: 300
    tool_chain:
      - auth_logs
      - gp_history
    reasoning_prompt: |
      Quantify the blast radius of compromised credentials by measuring ingress-to-lateral traversal velocity.
      1. Query gp_history and auth_logs for successful VPN authentications within the preceding 30-minute window.
      2. For each assigned client IP (user_ip_mapping), execute session_filter_source.
      3. Filter out baseline web-browsing and DNS; isolate administrative and lateral protocols (SSH, RDP, Kerberos, SMB).
      4. Calculate the temporal delta (ΔT) between initial gateway authentication and the first lateral connection.
         If ΔT < 300 seconds, flag as an automated credential compromise pivot.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing authenticated identity, target segment exposure, and verified ΔT velocity",
        "evidence": ["tool: key finding", ...],
        "metrics": {"delta_t_seconds": N, "lateral_sessions": N, "vpn_users_checked": N}
      }
    actions:
      - label: "Terminate Session"
        tool: "clear_session_id"
        requires_approval: true
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 24

  polymorphic_evasion:
    id: "FT-03"
    name: "App-ID Evasion & Unknown Protocol Inspection"
    description: "Detects non-standard traffic mutations and classification failures designed to blind Content-ID inspection"
    severity: "critical"
    schedule: "continuous"
    interval_seconds: 300
    tool_chain:
      - app_cache_summary
      - session_all
      - global_counters
      - wildfire_status
    reasoning_prompt: |
      Identify evasive command-and-control (C2) flows engineered to bypass App-ID classification via protocol fragmentation or tunneling.
      1. Query session_all for active sessions categorized under 'unknown-tcp', 'unknown-udp', or 'insufficient-data'.
      2. Cross-reference with global_counters for asymmetric routing drops, TCP out-of-order errors, or decode failures.
      3. Inspect app_cache_summary for abnormal App-ID cache miss rates indicative of classification engine thrashing.
      4. Verify wildfire_status to ensure unclassified payloads are forwarded for behavioral sandboxing.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing unclassified session volume, affected zone boundaries, and inspection impact",
        "evidence": ["tool: key finding", ...],
        "metrics": {"unknown_sessions": N, "cache_miss_rate": N, "source_hosts": N}
      }
    actions:
      - label: "Block L4"
        tool: "clear_session_id"
        requires_approval: true
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 24

  credential_exhaustion:
    id: "MC-03"
    name: "Credential Stuffing & Authentication Anomaly"
    description: "Detects distributed brute-force or credential stuffing sequences culminating in successful perimeter ingress"
    severity: "critical"
    schedule: "continuous"
    interval_seconds: 300
    tool_chain:
      - auth_logs
      - gp_history
      - threat_logs
    reasoning_prompt: |
      Identify distributed credential stuffing patterns targeting perimeter authentication gateways.
      1. Query auth_logs for clustered authentication failures (>5 failures within a 60-second window).
      2. Correlate whether sequential failures are succeeded by an authenticated session from the identical source or identity.
      3. Cross-reference gp_history to determine if active VPN tunnels were successfully negotiated following failures.
      4. Inspect threat_logs for corroborating brute-force or credential access signatures.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing source IP provenance, target accounts, and perimeter access outcome",
        "evidence": ["tool: key finding", ...],
        "metrics": {"failed_attempts": N, "success_after_failure": true/false, "source_ips": N}
      }
    actions:
      - label: "Block Source IP"
        tool: "clear_session_id"
        requires_approval: true
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 24


  # ─── PERIODIC CARDS (Every 30 Minutes) ──────────────────────────────
  # Drift detection and posture monitoring

  phantom_flow_audit:
    id: "MC-01"
  # ─── PERIODIC CARDS (Every 30 Minutes) ──────────────────────────────
  # Drift detection and posture monitoring

  phantom_flow_audit:
    id: "MC-01"
    name: "Security Policy Intent vs. Forwarding FIB Divergence"
    description: "Reconciles configured security policies against dataplane routing tables to identify forwarding blackholes or unauthorized transit"
    severity: "caution"
    schedule: "periodic"
    interval_seconds: 1800
    tool_chain:
      - routing_route
      - interface_all
      - session_info
    reasoning_prompt: |
      Verify that active security policy intent aligns with the underlying Forwarding Information Base (FIB).
      1. Use test_security_policy across representative source/destination pairs (internal subnets to egress gateways, inter-zone transit, VPN to core).
      2. Execute test_routing_lookup against the identical destination IP vectors.
      3. Correlate with get_live_config to extract active zone boundary bindings.
      4. Flag architectural divergence: traffic permitted by policy that blackholes in routing, or routable paths lacking explicit security policy governance.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing policy-to-routing divergence, affected destination subnets, and operational consequence",
        "evidence": ["tool: key finding", ...],
        "metrics": {"mismatches_found": N, "tests_run": N}
      }
    actions:
      - label: "View Full Audit"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 24

  silent_drop_debugger:
    id: "MC-02"
    name: "Dataplane Counter Anomaly & Silent Drop Inspection"
    description: "Monitors global hardware and buffer drop counters incrementing above statistical baselines"
    severity: "caution"
    schedule: "periodic"
    interval_seconds: 1800
    tool_chain:
      - global_counters
      - interface_all
      - session_info
    reasoning_prompt: |
      Inspect hardware dataplane drop counters for abnormal packet discard rates indicative of micro-bursts, MTU mismatches, or volumetric denial-of-service.
      1. Query global_counters and isolate rapidly incrementing drop reasons (e.g. flow_fwd_l3_mismatch, pkt_alloc_failure).
      2. Inspect interface_all for physical CRC anomalies, input queue discards, or link state transitions.
      3. Correlate with session_info to determine if drops coincide with session table or packet buffer exhaustion.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing incrementing drop vectors, interface impact, and service degradation risk",
        "evidence": ["tool: key finding", ...],
        "metrics": {"total_drops": N, "drop_rate_per_sec": N, "interface_errors": N}
      }
    actions:
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 24

  ghost_in_machine:
    id: "MC-06"
    name: "App-ID Classification Evasion & Cache Degradation"
    description: "Detects elevated App-ID cache miss rates and unclassified session thrashing indicative of classification bypass"
    severity: "caution"
    schedule: "periodic"
    interval_seconds: 1800
    tool_chain:
      - session_all
      - app_stats
    reasoning_prompt: |
      Audit App-ID classification performance for signs of deliberate evasion or engine resource degradation.
      1. Query app_stats for hardware App-ID cache hit/miss distributions.
      2. Inspect session_all and quantify the ratio of active sessions designated as 'unknown-tcp', 'unknown-udp', or 'insufficient-data'.
      3. If the cache miss rate exceeds baseline by >15% or unclassified flows represent >10% of active sessions, 
         flag as an active evasion vector or App-ID engine degradation.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing App-ID classification miss ratios, unclassified session load, and security posture impact",
        "evidence": ["tool: key finding", ...],
        "metrics": {"cache_miss_rate_pct": N, "unknown_session_pct": N}
      }
    actions:
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 24

  ai_supply_chain:
    id: "FT-04"
    name: "Model Ingestion & External AI Endpoint Exfiltration"
    description: "Evaluates volumetric byte-ratio asymmetries and egress entropy on external generative AI endpoints"
    severity: "caution"
    schedule: "periodic"
    interval_seconds: 1800
    tool_chain:
      - session_all
      - threat_logs
    reasoning_prompt: |
      Identify unauthorized intellectual property or sensitive dataset exfiltration directed toward external AI/LLM API endpoints.
      1. Query session_all for active sessions destined for major AI cloud infrastructure (OpenAI, Anthropic, Google Gemini, internal inference clusters).
      2. Analyze volumetric byte ratios: standard conversational traffic manifests low ingress bytes with high egress tokens. 
         An inverted ratio (massive outbound uploads) indicates potential intellectual property staging or automated data harvesting.
      3. Cross-reference threat_logs for data filtering signatures or DLP rule hits on these flows.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing source host provenance, destination AI endpoint, transfer volumetric delta, and data leak exposure",
        "evidence": ["tool: key finding", ...],
        "metrics": {"anomalous_endpoints": N, "inverted_ratio_sessions": N}
      }
    actions:
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 24


  # ─── DAILY CARDS ────────────────────────────────────────────────────
  # Posture assessments and trend analysis

  app_id_integrity:
    id: "SY-01"
    name: "App-ID Enforcement & 'Any' Rule Exposure Audit"
    description: "Quantifies policy surface using unconstrained 'application: any' rules bypassing layer-7 inspection"
    severity: "normal"
    schedule: "daily"
    interval_seconds: 86400
    tool_chain:
      - session_all
    reasoning_prompt: |
      Audit App-ID policy enforcement coverage across the active security rulebase.
      1. Extract security rules via get_live_config xpath=/config/devices/entry/vsys/entry/rulebase/security.
      2. Enumerate permit rules configured with 'application: any'—these bypass deep packet inspection and operate as legacy port-based packet filters.
      3. Cross-reference with session_all to quantify active sessions traversing these uninspected rules.
      4. Compute posture metric: (rules_with_strict_app_id / total_permit_rules) * 100 = App-ID Enforcement Index.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "App-ID Enforcement Index: X%",
        "finding": "2-3 sentence summary detailing unconstrained rule count, affected inter-zone boundaries, and layer-7 blindspot exposure",
        "evidence": ["tool: key finding", ...],
        "metrics": {"app_id_coverage_pct": N, "any_app_rule_count": N, "unknown_app_session_count": N}
      }
    actions:
      - label: "View Full Audit"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 168

  threat_prevention_gap:
    id: "SY-02"
    name: "Threat Prevention Profile Coverage & Inspection Blindspots"
    description: "Identifies permit rules lacking Security Profile groups (Antivirus, Vulnerability, WildFire, Anti-Spyware)"
    severity: "normal"
    schedule: "daily"
    interval_seconds: 86400
    tool_chain:
      - threat_logs
    reasoning_prompt: |
      Identify architectural blindspots where permit policies omit threat prevention profile inspection.
      1. Pull active security rules and associated profile settings via get_live_config.
      2. Isolate permit rules that omit Security Profile Groups, Antivirus profiles, or Vulnerability Protection profiles.
      3. Evaluate threat_logs volume: an absence of threat detections on high-throughput perimeter rules indicates decoupled profiles rather than a clean network.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing uninspected rule count, affected zone boundaries, and threat exposure risk",
        "evidence": ["tool: key finding", ...],
        "metrics": {"unprotected_rule_count": N, "total_allow_rules": N, "threat_log_volume": N}
      }
    actions:
      - label: "View Full Audit"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 168

  temporal_drift:
    id: "SY-05"
    name: "Temporal Baseline Drift & Anomalous Volume Analysis"
    description: "Identifies systemic deviations in dataplane load, session throughput, and gateway connections against 30-day baselines"
    severity: "normal"
    schedule: "daily"
    interval_seconds: 86400
    tool_chain:
      - hardware_telemetry
      - session_info
      - gp_history
    reasoning_prompt: |
      Benchmark real-time operational telemetry against empirical rolling baselines to detect capacity saturation or anomalous volume shifts.
      1. Execute hardware_telemetry to pull dataplane CPU load, memory utilization, and storage capacity.
      2. Query session_info for active concurrent session count and packet forwarding throughput.
      3. Query gp_history for remote access gateway authentication volume.
      4. Flag any core metric exhibiting a statistically significant deviation (e.g. > +2.0σ) from historical baselines.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing baseline deviation sigma, affected subsystems, and capacity sustainability forecast",
        "evidence": ["tool: key finding", ...],
        "metrics": {"cpu_load": N, "memory_pct": N, "active_sessions": N, "vpn_connections": N}
      }
    actions:
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 168

  absence_interpreter:
    id: "SY-06"
    name: "Telemetry Absence & Inspection Blindspot Audit"
    description: "Reasons over negative space — evaluates whether absent threat logs indicate perimeter hygiene or decoupled inspection engines"
    severity: "normal"
    schedule: "daily"
    interval_seconds: 86400
    tool_chain:
      - threat_logs
      - wildfire_status
    reasoning_prompt: |
      Evaluate negative space: reason over expected telemetry that is conspicuously absent from active data streams.
      1. Inspect threat_logs. If logs are quiescent across high-traffic hours, evaluate root causes:
         - Is the WildFire cloud subscription operational and connected? (wildfire_status)
         - Are User-ID mappings active, or are identity agents unresponsive? (user_ip_mapping)
         - If user traffic is active but threat detections are zero, verify whether inspection profiles are unattached.
      2. Formulate a telemetry visibility index reflecting perimeter monitoring integrity.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing unobserved expected events, underlying architectural cause, and visibility gap score",
        "evidence": ["tool: key finding", ...],
        "metrics": {"threat_log_entries": N, "wildfire_connected": true/false, "userid_mappings": N}
      }
    actions:
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 168

  operational_resilience:
    id: "SY-09"
    name: "Hardware State & Dataplane Operational Resilience"
    description: "Evaluates comprehensive physical and virtual health — CPU, memory saturation, session table headroom, HA sync, licenses"
    severity: "normal"
    schedule: "daily"
    interval_seconds: 86400
    tool_chain:
      - hardware_telemetry
      - ha_status
      - session_info
      - license_info
    reasoning_prompt: |
      Deliver a comprehensive operational resilience and cluster availability audit.
      1. Execute hardware_telemetry to capture core CPU, memory utilization, disk partitions, and system uptime.
      2. Execute ha_status to verify cluster synchronization, heartbeat status, and failover determinism.
      3. Query session_info to evaluate current session allocation against platform hardware limits.
      4. Inspect license_info for expired or impending subscription expirations affecting threat engines.

      Calibration Thresholds:
      - CRITICAL: Active swap memory utilization (> 0), CPU load/vCPU > 1.5, expired Threat Prevention/WildFire subscriptions.
      - CAUTION: System uptime < 24h, load/vCPU 0.7-1.5, HA cluster peer synchronization degraded.
      - NORMAL: All subsystem metrics within nominal operational bounds.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing hardware health status, headroom availability, and operational continuity posture",
        "evidence": ["tool: key finding", ...],
        "metrics": {"cpu_load": N, "memory_pct": N, "active_sessions": N, "session_capacity_pct": N}
      }
    actions:
      - label: "View Full Report"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 168

  emergent_threat_correlation:
    id: "SY-10"
    name: "Multi-Vector Telemetry Correlation & Threat Reconstruction"
    description: "Cross-correlates multi-surface telemetry (identity, threat logs, session table, routing) to reconstruct distributed attack paths"
    severity: "normal"
    schedule: "daily"
    interval_seconds: 86400
    tool_chain:
      - threat_logs
      - session_info
      - auth_logs
      - global_counters
    reasoning_prompt: |
      Execute multi-dimensional correlation across discrete telemetry planes to reconstruct covert attack trajectories.
      1. Pull threat_logs, auth_logs, session_info, user_ip_mapping, and global_counters.
      2. SHARED KEY ANALYSIS: Correlate IP addresses across identity mappings, active session state, and security event logs.
      3. TEMPORAL CORRELATION: Identify causal event sequences occurring within sliding 300-second windows.
      4. Synthesize attack narratives: e.g. Gateway auth failure followed by successful pivot, coupled with outbound high-entropy sessions.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing correlated attack vectors, shared pivot identifiers, and comprehensive threat attribution",
        "evidence": ["tool: key finding", ...],
        "metrics": {"correlations_found": N, "sources_queried": N, "shared_ips": N}
      }
    actions:
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 168

  ha_split_brain:
    id: "MC-05"
    name: "High Availability (HA) Cluster & Split-Brain Risk Audit"
    description: "Evaluates HA synchronization, path monitoring, and routing neighbor adjacency to anticipate split-brain cluster partitions"
    severity: "normal"
    schedule: "daily"
    interval_seconds: 86400
    tool_chain:
      - ha_deep_audit
      - routing_bgp_peers
      - routing_ospf_neighbors
    reasoning_prompt: |
      Evaluate High Availability (HA) cluster integrity and preempt split-brain partition conditions.
      1. Execute ha_deep_audit to verify control and dataplane link synchronization and path monitoring reachability.
      2. Inspect routing_bgp_peers for peer state flapping or route advertisement instability.
      3. Inspect routing_ospf_neighbors for neighbor adjacency drops or dead-timer expirations.
      4. If HA link synchronization is degraded concurrently with routing peer flapping, flag split-brain risk as CRITICAL.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing cluster synchronization state, path monitor telemetry, and failover stability risk",
        "evidence": ["tool: key finding", ...],
        "metrics": {"sync_status": "in-sync|out-of-sync", "path_mon_failures": N, "bgp_peer_issues": N}
      }
    actions:
      - label: "Investigate"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 168


  # ─── WEEKLY CARDS ───────────────────────────────────────────────────
  # Deep posture assessments

  policy_intent_reality:
    id: "SY-04"
    name: "Policy Rulebase Hygiene & Attack Surface Minimization"
    description: "Identifies zero-hit rules, unconstrained wildcard policies, and architectural zone disparities"
    severity: "normal"
    schedule: "weekly"
    interval_seconds: 604800
    tool_chain:
      - session_info
    reasoning_prompt: |
      Conduct a comprehensive hygiene and attack surface audit across the security and NAT rulebase.
      1. Extract the complete security rulebase, NAT translations, and zone topologies via get_live_config.
      2. Enumerate dormant rules with zero historical hit counts (dormant permit rules constitute gratuitous attack surface).
      3. Identify overly permissive wildcard rules (any/any, service: any, application: any).
      4. Reconcile configured inter-zone policies against active session flow topology.

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "short finding title",
        "finding": "2-3 sentence summary detailing dormant rule count, overpermissive policies, and attack surface reduction recommendations",
        "evidence": ["tool: key finding", ...],
        "metrics": {"unused_rules": N, "overpermissive_rules": N, "total_rules": N}
      }
    actions:
      - label: "View Full Audit"
        type: "open_chat"
      - label: "Schedule Follow-Up"
        type: "open_chat"

  zero_trust_posture:
    id: "SY-08"
    name: "Zero Trust Architecture (ZTA) Maturity & Compliance Audit"
    description: "Benchmarks the firewall policy hierarchy against NIST SP 800-207 Zero Trust Architecture standards (0-100 score)"
    severity: "normal"
    schedule: "weekly"
    interval_seconds: 604800
    tool_chain:
      - session_info
    reasoning_prompt: |
      Quantify the firewall's Zero Trust Architecture (ZTA) maturity index on a standardized 0-100 scale based on NIST SP 800-207 principles.
      1. Extract active security policies via get_live_config.
      2. Deductions applied against baseline:
         - Rules with 'application: any' -> -10 per rule (Bypasses Layer-7 micro-perimeter)
         - Rules with 'service: any' -> -5 per rule (Exposes non-standard ports)
         - Rules lacking SSL Decryption profiles -> -5 per rule (Encrypted traffic blindspot)
         - Rules lacking Security Profile Groups -> -10 per rule (Omitted threat inspection)
         - Inter-zone policies with 'source: any' -> -5 per rule (Unconstrained trust boundary)
      3. Compute normalized maturity score (minimum 0, maximum 100).

      OUTPUT FORMAT (JSON):
      {
        "triggered": true/false,
        "severity": "critical|caution|normal",
        "title": "Zero Trust Maturity Index: X/100",
        "finding": "2-3 sentence summary detailing overall maturity score, primary deduction drivers, and immediate hardening priorities",
        "evidence": ["tool: key finding", ...],
        "metrics": {"zt_score": N, "any_rule_count": N, "no_decrypt_count": N, "no_profile_count": N}
      }
    actions:
      - label: "View Full Audit"
        type: "open_chat"
      - label: "Mute"
        type: "suppress"
        duration_hours: 336

  microsegmentation_illusion:
    id: "MC-04"
    name: "Micro-Segmentation & L2/L3 Boundary Verification"
    description: "Validates whether logical security zone boundaries are undermined by shared Layer-2 switching domains"
    severity: "normal"
    schedule: "weekly"
